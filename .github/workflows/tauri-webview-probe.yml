name: Tauri WebView compatibility probe

on:
  push:
    branches: [feat/tauri-desktop]
    paths:
      - .github/workflows/tauri-webview-probe.yml
      - tools/tauri-migration/webview-probe/**
      - packages/frontend/tauri-bridge/**
      - packages/frontend/tauri-core/**
      - packages/frontend/native/nbstore/**
      - tools/tauri-migration/*lottie*
      - packages/frontend/component/src/ui/lottie/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-probe:
    name: Native editor smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      BUILD_TYPE: canary
      YARN_ENABLE_SCRIPTS: 'false'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/tauri-probe-target
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '3'
      PROBE_OUTPUT_DIR: ${{ github.workspace }}/.coverage/tauri-probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          workspaces: tools/tauri-migration/webview-probe -> ../../../.cache/tauri-probe-target
          key: webview-probe-${{ runner.os }}
      - name: Install frontend dependencies without lifecycle scripts
        run: node .yarn/releases/yarn-4.18.0.cjs install --immutable --mode=skip-build
      - name: Generate reference template assets
        run: node .yarn/releases/yarn-4.18.0.cjs workspace @affine/templates build
      - name: Install native WebDriver
        run: cargo install tauri-wd --version 0.1.11 --locked --debug
      - name: Test native document authority schema
        shell: bash
        run: |
          TAURI_CONFIG="$(cat tools/tauri-migration/webview-probe/tauri.authority.conf.json)"
          export TAURI_CONFIG
          mkdir -p .coverage/tauri-probe/authority
          git rev-parse HEAD > .coverage/tauri-probe/authority/source-revision.log
          rustc --version > .coverage/tauri-probe/authority/toolchain.log
          cargo test --manifest-path tools/tauri-migration/webview-probe/Cargo.toml --locked --features authority-probe 2>&1 | tee .coverage/tauri-probe/authority/tests.log
          cargo fmt --manifest-path tools/tauri-migration/webview-probe/Cargo.toml -- --check
          cargo clippy --manifest-path tools/tauri-migration/webview-probe/Cargo.toml --locked --features authority-probe --all-targets --no-deps -- -D warnings 2>&1 | tee .coverage/tauri-probe/authority/clippy.log
      - name: Build isolated native authority diagnostic
        shell: bash
        run: |
          TAURI_CONFIG="$(cat tools/tauri-migration/webview-probe/tauri.authority.conf.json)"
          export TAURI_CONFIG
          cargo build --manifest-path tools/tauri-migration/webview-probe/Cargo.toml --locked --features e2e,authority-probe
      - name: Run native authority diagnostic (Linux)
        if: runner.os == 'Linux'
        env:
          PROBE_MODE: authority
          PROBE_OUTPUT_DIR: ${{ github.workspace }}/.coverage/tauri-probe/authority
        run: env -u WAYLAND_DISPLAY GDK_BACKEND=x11 xvfb-run -a -s '-screen 0 1600x1000x24' node tools/tauri-migration/webview-probe/run.mjs
      - name: Run native authority diagnostic (Windows/macOS)
        if: runner.os != 'Linux'
        env:
          PROBE_MODE: authority
          PROBE_OUTPUT_DIR: ${{ github.workspace }}/.coverage/tauri-probe/authority
        run: node tools/tauri-migration/webview-probe/run.mjs
      - name: Test and audit disposable native storage diagnostic
        shell: bash
        run: |
          TAURI_CONFIG="$(cat tools/tauri-migration/webview-probe/tauri.storage.conf.json)"
          export TAURI_CONFIG
          mkdir -p .coverage/tauri-probe/storage
          git rev-parse HEAD > .coverage/tauri-probe/storage/source-revision.log
          rustc --version > .coverage/tauri-probe/storage/toolchain.log
          cargo test --manifest-path tools/tauri-migration/webview-probe/Cargo.toml --locked --features e2e,storage-probe 2>&1 | tee .coverage/tauri-probe/storage/tests.log
          cargo clippy --manifest-path tools/tauri-migration/webview-probe/Cargo.toml --locked --features e2e,storage-probe --all-targets --no-deps -- -D warnings 2>&1 | tee .coverage/tauri-probe/storage/clippy.log
          cargo tree --manifest-path tools/tauri-migration/webview-probe/Cargo.toml --locked --features e2e,storage-probe --edges normal,build --prefix none --format '{p}' > .coverage/tauri-probe/storage/dependencies.log
          if grep -qi napi .coverage/tauri-probe/storage/dependencies.log; then
            echo 'N-API crate found in the storage diagnostic dependency graph' >&2
            exit 1
          fi
      - name: Build isolated native storage diagnostic
        shell: bash
        run: |
          node tools/tauri-migration/webview-probe/storage-build.mjs
          TAURI_CONFIG="$(cat tools/tauri-migration/webview-probe/tauri.storage.conf.json)"
          export TAURI_CONFIG
          cargo build --manifest-path tools/tauri-migration/webview-probe/Cargo.toml --locked --features e2e,storage-probe
      - name: Run native storage diagnostic (Linux)
        if: runner.os == 'Linux'
        env:
          PROBE_MODE: storage
          PROBE_OUTPUT_DIR: ${{ github.workspace }}/.coverage/tauri-probe/storage
        run: env -u WAYLAND_DISPLAY GDK_BACKEND=x11 xvfb-run -a -s '-screen 0 1600x1000x24' node tools/tauri-migration/webview-probe/run.mjs
      - name: Run native storage diagnostic (Windows/macOS)
        if: runner.os != 'Linux'
        env:
          PROBE_MODE: storage
          PROBE_OUTPUT_DIR: ${{ github.workspace }}/.coverage/tauri-probe/storage
        run: node tools/tauri-migration/webview-probe/run.mjs
      - name: Build minimal native protocol diagnostic
        shell: bash
        run: |
          TAURI_CONFIG="$(cat tools/tauri-migration/webview-probe/tauri.protocol.conf.json)"
          export TAURI_CONFIG
          cargo build --manifest-path tools/tauri-migration/webview-probe/Cargo.toml --locked --features e2e,protocol-probe
      - name: Run native protocol diagnostic (Linux)
        if: runner.os == 'Linux'
        env:
          PROBE_MODE: protocol
          PROBE_OUTPUT_DIR: ${{ github.workspace }}/.coverage/tauri-probe/protocol
        run: env -u WAYLAND_DISPLAY GDK_BACKEND=x11 xvfb-run -a -s '-screen 0 1600x1000x24' node tools/tauri-migration/webview-probe/run.mjs
      - name: Run native protocol diagnostic (Windows/macOS)
        if: runner.os != 'Linux'
        env:
          PROBE_MODE: protocol
          PROBE_OUTPUT_DIR: ${{ github.workspace }}/.coverage/tauri-probe/protocol
        run: node tools/tauri-migration/webview-probe/run.mjs
      - name: Build isolated native editor probe
        run: cargo build --manifest-path tools/tauri-migration/webview-probe/Cargo.toml --locked --features e2e
      - name: Run native editor probe (Linux)
        if: runner.os == 'Linux'
        run: env -u WAYLAND_DISPLAY GDK_BACKEND=x11 xvfb-run -a -s '-screen 0 1600x1000x24' node tools/tauri-migration/webview-probe/run.mjs
      - name: Run native editor probe (Windows/macOS)
        if: runner.os != 'Linux'
        run: node tools/tauri-migration/webview-probe/run.mjs
      - name: Validate expression-free animation assets
        run: node --test tools/tauri-migration/lottie-assets.test.mjs
      - name: Build local static frontend assets
        env:
          PUBLIC_PATH: /
          NODE_OPTIONS: --max-old-space-size=8192
        run: node .yarn/releases/yarn-4.18.0.cjs affine bundle -p @affine/web
      - name: Build embedded native editor probe
        shell: bash
        run: |
          TAURI_CONFIG="$(cat tools/tauri-migration/webview-probe/tauri.bundled.conf.json)"
          export TAURI_CONFIG
          cargo build --manifest-path tools/tauri-migration/webview-probe/Cargo.toml --locked --features e2e,bundled-frontend
      - name: Run embedded editor probe (Linux)
        if: runner.os == 'Linux'
        env:
          PROBE_BUNDLED_FRONTEND: '1'
          PROBE_OUTPUT_DIR: ${{ github.workspace }}/.coverage/tauri-probe/bundled
        run: env -u WAYLAND_DISPLAY GDK_BACKEND=x11 xvfb-run -a -s '-screen 0 1600x1000x24' node tools/tauri-migration/webview-probe/run.mjs
      - name: Run embedded editor probe (Windows/macOS)
        if: runner.os != 'Linux'
        env:
          PROBE_BUNDLED_FRONTEND: '1'
          PROBE_OUTPUT_DIR: ${{ github.workspace }}/.coverage/tauri-probe/bundled
        run: node tools/tauri-migration/webview-probe/run.mjs
      - name: Upload probe evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-webview-probe-${{ runner.os }}-${{ runner.arch }}
          path: .coverage/tauri-probe
          if-no-files-found: warn
          retention-days: 14
