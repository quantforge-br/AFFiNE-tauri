name: Tauri Rust storage core

on:
  push:
    branches: [feat/tauri-desktop]
    paths:
      - .github/workflows/tauri-core.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - rustfmt.toml
      - .cargo/**
      - packages/frontend/tauri-core/**
      - packages/frontend/native/nbstore/**
      - packages/frontend/native/schema/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  storage:
    name: Rust SQLite authority (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/tauri-core-target
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '3'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: . -> .cache/tauri-core-target
          key: tauri-core-${{ runner.os }}
      - name: Record native environment
        run: |
          mkdir -p .coverage/tauri-core
          rustc -vV | tee .coverage/tauri-core/toolchain.log
          git rev-parse HEAD | tee .coverage/tauri-core/source-revision.log
      - name: Check Rust formatting
        run: cargo fmt -p affine_tauri_core -- --check
      - name: Audit standalone dependency graph
        run: |
          cargo tree -p affine_tauri_core --locked --edges normal,build --prefix none --format '{p}' | tee .coverage/tauri-core/dependencies.log
          if grep -E '^napi( v|-)' .coverage/tauri-core/dependencies.log; then
            echo 'The standalone storage authority must not depend on N-API.' >&2
            exit 1
          fi
      - name: Run real SQLite authority tests
        run: cargo test -p affine_tauri_core --locked 2>&1 | tee .coverage/tauri-core/tests.log
      - name: Lint the storage authority
        run: cargo clippy -p affine_tauri_core --all-targets --locked --no-deps -- -D warnings 2>&1 | tee .coverage/tauri-core/clippy.log
      - name: Preserve standalone storage regressions
        run: cargo test -p affine_nbstore --no-default-features --features use-as-lib --locked 2>&1 | tee .coverage/tauri-core/nbstore-tests.log
      - name: Upload native storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-core-${{ runner.os }}-${{ runner.arch }}
          path: .coverage/tauri-core
          if-no-files-found: error
